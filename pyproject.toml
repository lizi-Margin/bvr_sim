[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "bvr-sim"
version = "0.3.0"
description = "3D Beyond Visual Range (BVR) air combat environment for multi-agent reinforcement learning"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "gymnasium",
    "gym",
    "opencv-python",
    "commentjson",
    "tqdm",
    "colorama",
    "JSBSim==1.1.14",
]

[tool.scikit-build]
cmake.source-dir = "bvr_sim"
cmake.build-type = "Release"
build.targets = ["bvr_sim_cpp"]
wheel.packages = ["bvr_sim"]
sdist.exclude = [
    ".git/**",
    ".github/**",
    "benchmark_logs/**",
    "build/**",
    "dist/**",
    "test_logs/**",
    "bvr_sim/build/**",
    "bvr_sim/install/**",
]

[tool.scikit-build.cmake.define]
BVR_SIM_PYTHON_MODULE_DESTINATION = "bvr_sim"

[[tool.scikit-build.overrides]]
if.platform-system = "windows"
inherit.cmake.define = "append"
cmake.build-type = "RelWithDebInfo"

[[tool.scikit-build.overrides]]
if.platform-system = "linux"
inherit.cmake.define = "append"
cmake.build-type = "Release"

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
archs = ["x86_64", "AMD64"]
